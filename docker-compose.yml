services:
  # ----------------------------------------------------------------------------
  # Dark City Backend Server
  # ----------------------------------------------------------------------------
  dark-city-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: dark-city-server:latest
    container_name: dark-city-server
    restart: unless-stopped
    ports:
      - '${SERVER_PORT:-8080}:8080'
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgres://dc_dev:dc_dev-pass_!-QW@postgres:5432/dc_dev}
      - INFERENCE_GATEWAY_URL=${INFERENCE_GATEWAY_URL:-http://inference:8000}
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - darkcity-net

  # ----------------------------------------------------------------------------
  # PostgreSQL with pgvector extension (Development database)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg18
    container_name: dark-city-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=dc_dev
      - POSTGRES_PASSWORD=dc_dev-pass_!-QW
      - POSTGRES_DB=dc_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dc_dev -d dc_dev']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - darkcity-net

volumes:
  postgres_data:
    driver: local

networks:
  darkcity-net:
    driver: bridge
